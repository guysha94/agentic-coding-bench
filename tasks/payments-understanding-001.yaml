id: payments-understanding-001
name: Place a new authorization rule in the correct architectural layer
category: repo_understanding
difficulty: medium
version: 1

repository:
  path: ./fixtures/payment-service
  base_commit: main
  isolation: worktree

task:
  prompt: |
    Compliance requires that any single payment of 3000.00 or more is blocked unless the
    payment's metadata contains `approved_by` set to a non-empty string.

    Blocked payments must raise a new `ApprovalRequired` error deriving from
    `PaymentError`, and the API must map it to HTTP 403.

    Before writing code, work out where this rule belongs in this codebase's
    architecture. The repository has a deliberate layering: read the README and follow
    the existing dependency direction. Put the rule in the layer that already owns rules
    of this kind, and do not introduce an architecture violation such as importing an
    upper layer from a lower one, or embedding a business rule in the transport layer.

    Add tests for both the blocked and approved paths.

timeout_minutes: 25

validation:
  - name: unit-tests
    kind: test
    command: $ACB_PYTHON -m pytest
  - name: lint
    kind: lint
    command: $ACB_PYTHON -m ruff check . || true
  - name: hidden-layering-tests
    kind: test
    hidden: true
    command: $ACB_PYTHON -m pytest tests/hidden_test_layering.py
    provides_files:
      tests/hidden_test_layering.py: hidden/payments-understanding-001/hidden_test_layering.py

success:
  require_tests_pass: true
  require_hidden_tests_pass: true
  require_no_regressions: true

language: python
framework: pytest
tool_call_budget: 35
expected_files:
  - src/payments/services/payment_service.py
  - src/payments/domain/errors.py
  - src/payments/api/routes.py
expected_solution: >
  The rule belongs in the service layer (it is an orchestration/policy rule needing the
  payment's metadata), with the error type in the domain layer and only the status-code
  mapping in the API layer. Hidden tests assert the rule fires when the service is called
  directly -- so an implementation that only guards the API layer fails -- and assert the
  domain layer imports nothing from services or api.
tags: [python, architecture, layering]
