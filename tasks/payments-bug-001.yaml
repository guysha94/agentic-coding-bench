id: payments-bug-001
name: Fix incorrect processing-fee rounding
category: bug_fix
difficulty: easy
version: 1

repository:
  path: ./fixtures/payment-service
  base_commit: bug/fee-rounding
  isolation: worktree

task:
  prompt: |
    Two tests in tests/test_fees.py are failing. Processing fees are being rounded
    incorrectly, which under-charges customers by a cent on many transactions.

    Find the root cause and fix it. Do not change the tests.

timeout_minutes: 10

validation:
  - name: unit-tests
    kind: test
    command: $ACB_PYTHON -m pytest
  - name: lint
    kind: lint
    command: $ACB_PYTHON -m ruff check . || true
  - name: hidden-fee-tests
    kind: test
    hidden: true
    command: $ACB_PYTHON -m pytest tests/hidden_test_fees.py
    provides_files:
      tests/hidden_test_fees.py: hidden/payments-bug-001/hidden_test_fees.py

success:
  require_tests_pass: true
  require_hidden_tests_pass: true
  require_no_regressions: true

language: python
framework: pytest
tool_call_budget: 12
expected_files:
  - src/payments/domain/fees.py
expected_solution: >
  The quantize call uses ROUND_DOWN instead of ROUND_HALF_UP. Restoring half-up rounding
  (and the corresponding import) fixes both tests. Hidden tests check additional
  boundaries so a hardcoded special case will not pass.
tags: [python, backend, decimal, easy]
